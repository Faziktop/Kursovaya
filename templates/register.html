<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - ИжГУ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa fa-university"></i>
                </div>
                <h2 class="auth-title">Личный кабинет</h2>
                <p class="auth-subtitle">Регистрация нового пользователя</p>
            </div>
            <form class="auth-form" method="POST" action="/register">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fa fa-user"></i>
                        Фамилия Имя Отчество
                    </label>
                    <div class="input-wrapper">
                        <input type="text" name="fullname" class="form-input" placeholder="Иванов Иван Иванович" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fa fa-envelope"></i>
                        E-mail
                    </label>
                    <div class="input-wrapper">
                        <input type="email" name="email" class="form-input" placeholder="example@istu.ru" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fa fa-lock"></i>
                        Пароль
                    </label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('password', 'toggleIcon1')">
                            <i class="fa fa-eye-slash" id="toggleIcon1"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fa fa-check-circle"></i>
                        Подтверждение пароля
                    </label>
                    <div class="input-wrapper">
                        <input type="password" name="password_confirm" id="password2" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('password2', 'toggleIcon2')">
                            <i class="fa fa-eye-slash" id="toggleIcon2"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa fa-user-plus"></i>
                    Зарегистрироваться
                </button>

                <div class="auth-footer">
                    <span class="text-muted">Уже есть аккаунт?</span>
                    <a href="/login" class="register-link">Войти</a>
                </div>

                <div class="support-link">
                    <i class="fa fa-headphones"></i>
                    <a href="#">Написать в техподдержку</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePassword(fieldId, iconId) {
            const password = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
