<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - ИжГУ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fa fa-university"></i>
                </div>
                <h2 class="auth-title">Личный кабинет</h2>
                <p class="auth-subtitle">Вход в систему</p>
            </div>
            <form class="auth-form" method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fa fa-envelope"></i>
                        E-mail
                    </label>
                    <div class="input-wrapper">
                        <input type="email" name="email" class="form-input" placeholder="example@istu.ru" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fa fa-lock"></i>
                        Пароль
                    </label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fa fa-eye-slash" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="#" class="forgot-link">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa fa-sign-in"></i>
                    Войти
                </button>

                <div class="auth-footer">
                    <span class="text-muted">Впервые здесь?</span>
                    <a href="/register" class="register-link">Зарегистрироваться</a>
                </div>

                <div class="support-link">
                    <i class="fa fa-headphones"></i>
                    <a href="#">Написать в техподдержку</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
